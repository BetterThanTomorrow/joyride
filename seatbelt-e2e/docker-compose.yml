name: joyride-integration-test

# Started by run-containerized.sh, which sets JOYRIDE_REPO to the checkout's host path.
# The checkout is mounted at that same path, so paths given on the command line work in the container.
services:
  integration-test:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: ${JOYRIDE_REPO:?Start through run-containerized.sh}
    volumes:
      - ${JOYRIDE_REPO}:${JOYRIDE_REPO}
      # Linux VS Code, its user data and extensions, apart from the host's
      - vscode-test:${JOYRIDE_REPO}/.vscode-test
    init: true

volumes:
  vscode-test:
